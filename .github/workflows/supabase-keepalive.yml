name: Supabase Keep-Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0,3'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "Supabase ping -> HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
